<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- FeedMeBooks launcher icon, drawn on the Android adaptive-icon canvas (108dp, safe zone = centre 66dp circle). -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B5088"/>
      <stop offset="1" stop-color="#1F2E55"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#ink)"/>
  <g transform="translate(54 58.5) scale(1.12) translate(-54 -58.5)">
  <!-- cover -->
  <path d="M54 46 C48 41.5 38 40.5 29.5 42.5 L29.5 75 C38 73 48 74 54 79 C60 74 70 73 78.5 75 L78.5 42.5 C70 40.5 60 41.5 54 46 Z" fill="#152040"/>
  <!-- pages -->
  <path d="M54 42.5 C48.5 38.5 39 37.5 32.5 39.5 L32.5 71.5 C39 69.5 48.5 70.5 54 74.5 Z" fill="#F7F2E8"/>
  <path d="M54 42.5 C59.5 38.5 69 37.5 75.5 39.5 L75.5 71.5 C69 69.5 59.5 70.5 54 74.5 Z" fill="#FFFBF3"/>
  <!-- gutter shadow -->
  <path d="M54 42.5 L54 74.5" stroke="#C9BFAE" stroke-width="1.2"/>
  <!-- text lines, left page -->
  <g stroke="#2F4170" stroke-width="2.2" stroke-linecap="round">
    <path d="M37.5 47.5 L49 45.8"/>
    <path d="M37.5 52.5 L47 51.2"/>
    <path d="M37.5 57.5 L49 56.3"/>
    <path d="M37.5 62.5 L46 61.5"/>
    <path d="M37.5 67.5 L43 67"/>
  </g>
  <!-- the narrator's voice, right page -->
  <g stroke="#F5B52E" stroke-width="3" stroke-linecap="round">
    <path d="M60 53.5 L60 59.5"/>
    <path d="M64.5 48.5 L64.5 64"/>
    <path d="M69 51.5 L69 61"/>
    <path d="M73.5 54.5 L73.5 58"/>
  </g>
  </g>
</svg>
