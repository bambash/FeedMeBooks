name: Native APK

# Builds the native Kotlin app's POC variant (the store build plus the Lab screens, signed
# with the committed POC key) and publishes one installable APK per run.
# Download: Actions → this workflow → a run → Artifacts → feedmebooks-poc-<sha>.
# A second job builds the store variant unsigned, so a change that only breaks the release
# build type is caught here; the signed bundle is built by native-release.yml on version tags.

on:
  push:
    paths:
      - "native/**"
      - ".github/workflows/native-apk.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-apk.yml"
  workflow_dispatch:

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test and build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core tests
        run: ./gradlew :core:test --no-daemon

      - name: Build POC APK
        run: ./gradlew :app:assemblePoc --no-daemon --stacktrace

      # Play rejects bundles whose native libraries are not 16 KB page-aligned (apps targeting
      # Android 15+, since 2025-11-01). Fail here, not in the Console.
      - name: Check 16 KB page alignment
        run: |
          rm -rf /tmp/apk-lib && mkdir -p /tmp/apk-lib
          unzip -qo app/build/outputs/apk/poc/app-poc.apk 'lib/*' -d /tmp/apk-lib
          status=0
          for so in $(find /tmp/apk-lib -name '*.so'); do
            bad=$(readelf -lW "$so" | awk '$1 == "LOAD" && strtonum($NF) < 16384 { print }')
            if [[ -n "$bad" ]]; then
              echo "::error::$so has LOAD segments aligned below 16 KB:"; echo "$bad"; status=1
            else
              echo "ok: ${so#/tmp/apk-lib/} ($(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | tr '\n' ' '))"
            fi
          done
          exit $status

      - name: Name APK
        id: apk
        run: |
          name="feedmebooks-poc-${GITHUB_SHA::7}"
          mv app/build/outputs/apk/poc/app-poc.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: native/${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Store bundle (unsigned)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build store bundle
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: feedmebooks-store-unsigned-${{ github.sha }}
          path: native/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
